# ======================================================================
#  CYBER OBSERVABILITY STACK – Coolify + Prometheus + Grafana + cAdvisor + Node Exporter
# ----------------------------------------------------------------------
#  Description:
#  This Docker Compose file deploys a full self-hosted monitoring environment on Ubuntu.
#  It includes Prometheus for metrics collection, Grafana for visualization,
#  cAdvisor for container-level telemetry, and Node Exporter for host metrics.
#
#  Deployment:
#  1. Save this file as `docker-compose.yml`
#  2. Run `docker compose up -d` or deploy via Coolify as a Docker Compose Resource.
#  3. Access services:
#     - Grafana:      http://<server-ip>:3000
#     - Prometheus:   http://<server-ip>:9090
#     - cAdvisor UI:  http://<server-ip>:8081
#     - Coolify:      http://<server-ip>:8000
#
#  Author: Ritvik Indupuri
#  Date: October 2025
#
# ======================================================================

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v3.9.1@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    restart: unless-stopped
    ports:
      - "8081:8080"     # host 8081 avoids conflict with Coolify (8080)
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # privileged: true   # uncomment if cgroups access denied

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 5s

      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['prometheus:9090']

        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']

        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']

volumes:
  prometheus-data:
  grafana-storage:
